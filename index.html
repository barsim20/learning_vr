<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainDonald's</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a0a00; overflow: hidden; font-family: sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        pointer-events: none;
        z-index: 10;
      }

      #vr-button {
        pointer-events: all;
        padding: 16px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        color: #fff;
        background: #e63946;
        border: 3px solid #fff;
        border-radius: 50px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: transform 0.1s, background 0.2s;
      }
      #vr-button:hover { background: #c1121f; transform: scale(1.04); }
      #vr-button:disabled { background: #555; cursor: default; }

      #status {
        color: #ffd166;
        font-size: 0.9rem;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="overlay">
      <div id="status">Loading BrainDonald's…</div>
      <button id="vr-button" disabled>Enter VR</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
